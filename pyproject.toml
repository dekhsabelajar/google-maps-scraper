[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-maps-scraper"
version = "1.0.0"
description = "Sistem Ekstraksi Kontak Bisnis Google Maps & Pengayaan Email Asinkron"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "SQLAlchemy>=2.0.25",
    "click>=8.1.7",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gmaps-scraper = "main:main"
agent-loop = "loop.runner:main"
